const MAXB=50*1024*1024;
function fileHost(scope,sid){return scope==='session'?SES(sid):S.materials.find(m=>m.id===sid)}
function kindOf(f){return (f.type||'').startsWith('video/')?'video':'doc'}
async function uploadFiles(scope,sid,fileList){const host=fileHost(scope,sid);if(!host)return;const arr=[...fileList];
 for(const f of arr){if(f.size>MAXB){toast(t('tooBig',{n:f.name}));continue}
  const st=$('#upst');if(st)st.textContent=t('uploading',{n:f.name});
  const ext=((f.name.match(/\.([a-z0-9]{1,6})$/i)||[])[1]||'bin').toLowerCase(),path=user.id+'/'+(scope==='session'?sid:'materials')+'/'+uid()+'.'+ext;
  const{error}=await sb.storage.from('files').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});
  if(error){toast(t('upErr',{e:error.message}));continue}
  const url=sb.storage.from('files').getPublicUrl(path).data.publicUrl,name=f.name.replace(/\.[^.]+$/,'');
  if(scope==='session'){host.files=host.files||[];host.files.push({id:uid(),name,kind:kindOf(f),url,path,size:f.size});markSes(host.date)}
  else{host.url=url;host.path=path;host.kind=kindOf(f);host.size=f.size;mark('materials')}
  toast(t('uploaded'))}
 render()}
